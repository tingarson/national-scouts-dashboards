<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<title>National Scouts · Dashboards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#080a0c}
body{background:#080a0c;color:#e8e0d0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:32px 20px env(safe-area-inset-bottom,64px)}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(245,166,35,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,166,35,.03) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0}
.app{max-width:600px;margin:0 auto;position:relative;z-index:1}
header{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid rgba(245,166,35,.12)}
.tag{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:#f5a623;opacity:.7;margin-bottom:8px}
h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:700;letter-spacing:-.01em;color:#f5a623;line-height:1}
.grid{display:flex;flex-direction:column;gap:12px}
.card{display:block;text-decoration:none;background:#111416;border:1px solid rgba(245,166,35,.12);
  border-radius:12px;padding:20px 24px;transition:border-color .15s,background .15s;
  -webkit-tap-highlight-color:transparent}
.card:active{background:#181b1e;border-color:rgba(245,166,35,.4)}
.card-name{font-size:1.15rem;font-weight:600;color:#e8e0d0;margin-bottom:4px}
.card-date{font-size:.75rem;color:#7a6e5e}
.empty{color:#7a6e5e;font-size:.9rem;margin-top:16px}
footer{margin-top:40px;font-size:.7rem;color:#4a4438;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tag">National Scouts</div>
    <h1>Route Dashboards</h1>
  </header>
  <div class="grid">
<a class="card" href="California.html"><div class="card-name">California</div><div class="card-date">Generated Mar 12, 2026</div></a>
<a class="card" href="Colorado.html"><div class="card-name">Colorado</div><div class="card-date">Generated Mar 12, 2026</div></a>
<a class="card" href="Illinois Zone A.html"><div class="card-name">Illinois Zone A</div><div class="card-date">Generated Apr 21, 2026</div></a>
<a class="card" href="Louisiana.html"><div class="card-name">Louisiana</div><div class="card-date">Generated Aug 12, 2026</div></a>
<a class="card" href="South Carolina.html"><div class="card-name">South Carolina</div><div class="card-date">Generated Apr 28, 2026</div></a>
<a class="card" href="Washington.html"><div class="card-name">Washington</div><div class="card-date">Generated Apr 21, 2026</div></a>
  </div>
  <footer>Updated Aug 12, 2026 12:54</footer>
</div>
</body>
</html>
